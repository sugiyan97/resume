name: build pdf

on:
  push:
    tags:
    - 'v*'

permissions: {}

jobs:
  build:
    name: build pdf and upload release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # リリースを作成する workflow のため、キャッシュ汚染を避けて依存キャッシュは使わない
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: build pdf
        run: yarn run build:pdf
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" docs/index.pdf --repo "$GITHUB_REPOSITORY" --title "Release $GITHUB_REF_NAME" --notes ""
